name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: windows-latest

    env:
      APP_ENVIRONMENT: test
      DATABASE_URL: sqlite:///./ci-runtime.db
      JWT_SECRET_KEY: ci-only-jwt-secret-key-change-me-1234567890
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      AI_PROVIDER: disabled
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-5-mini
      AI_REQUEST_TIMEOUT_SECONDS: 30
      AI_MAX_INPUT_CHARS: 30000

      CELERY_BROKER_URL: redis://localhost:6379/0

      THREAT_INTEL_PROVIDER: disabled
      ABUSEIPDB_API_KEY: ""
      ABUSEIPDB_BASE_URL: https://api.abuseipdb.com/api/v2
      ABUSEIPDB_MAX_AGE_DAYS: 90
      THREAT_INTEL_TIMEOUT_SECONDS: 10
      THREAT_INTEL_CACHE_TTL_HOURS: 24

      PYTHONUTF8: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Verify application import
        run: python -c "from app.main import app; print(app.title)"

      - name: Run test suite
        run: python -m pytest

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: tests

    env:
      APP_ENVIRONMENT: test
      POSTGRES_DB: security_ai
      POSTGRES_USER: security_ai
      POSTGRES_PASSWORD: ci-database-password
      JWT_SECRET_KEY: ci-only-jwt-secret-key-change-me-1234567890

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build application image
        run: docker build --tag security-ai:ci .