<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ page_title }}</title>

    <link
        rel="stylesheet"
        href="/static/css/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/cases.css"
    >

    <script
        src="https://unpkg.com/htmx.org@2.0.4"
        defer
    ></script>
</head>

<body>

<div class="app-shell">

    <aside class="sidebar">

        <div class="brand">
            SECURITY AI
        </div>

        <nav class="navigation">

            <a
                href="/dashboard"
                class="navigation-item"
            >
                Dashboard
            </a>

            <a
                href="/dashboard/analyses"
                class="navigation-item"
            >
                Analyses
            </a>

            <a
                href="/dashboard/cases"
                class="navigation-item active"
            >
                Cases
            </a>

        </nav>

        <div class="sidebar-footer">

            <div class="signed-in-user">

                <span class="signed-in-label">
                    Signed in as
                </span>

                <strong>
                    {{ current_user.username }}
                </strong>

            </div>

            <form
                method="post"
                action="/logout"
            >
                <button
                    class="logout-button"
                    type="submit"
                >
                    Sign out
                </button>
            </form>

        </div>

    </aside>


    <main class="main-content">

        <div class="back-link-wrapper">

            <a
                href="/dashboard/cases"
                class="back-link"
            >
                ← Back to cases
            </a>

        </div>


        <header class="topbar">

            <div>

                <div class="eyebrow">
                    INVESTIGATION CASE
                </div>

                <h1>
                    {{ case.title }}
                </h1>

                <p class="subtitle analysis-id">
                    {{ case.id }}
                </p>

            </div>

        </header>


        {% include "partials/case_detail_content.html" %}

    </main>

</div>

</body>

</html>
