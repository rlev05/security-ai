<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ page_title }}</title>

    <link
        rel="stylesheet"
        href="/static/css/dashboard.css"
    >
</head>

<body class="login-body">

    <main class="login-shell">

        <section class="login-card">

            <div class="login-brand">
                SECURITY AI
            </div>

            <h1>
                Analyst Login
            </h1>

            <p class="login-description">
                Sign in to access security analyses,
                investigations and cases.
            </p>

            {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

            {% endif %}

            <form
                method="post"
                action="/login"
                class="login-form"
            >

                <label for="login">
                    Username or email
                </label>

                <input
                    id="login"
                    name="login"
                    type="text"
                    autocomplete="username"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="submit"
                    class="primary-button"
                >
                    Sign in
                </button>

            </form>

        </section>

    </main>

</body>

</html>
